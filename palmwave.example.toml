# Copy to `palmwave.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# PALMWAVE_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: PALMWAVE_GAME_DIR
game_dir = 'D:\palmwave-data\game'

# Derived data. Default: %LOCALAPPDATA%\palmwave\cache.   env: PALMWAVE_CACHE_DIR
# cache_dir = 'D:\palmwave-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\palmwave\data.   env: PALMWAVE_DATA_DIR
# data_dir = 'D:\palmwave-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: PALMWAVE_TEST_TITLES (separated by ';')
test_titles = []
