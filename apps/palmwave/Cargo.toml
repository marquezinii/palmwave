[package]
name = "palmwave"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
palmwave-core.workspace = true
palmwave-pe.workspace = true
palmwave-loader.workspace = true
palmwave-hle.workspace = true
palmwave-shader = { workspace = true, features = ["host"] }
palmwave-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "palmwave-core/diagnostics",
    "palmwave-hle/diagnostics",
    "palmwave-loader/diagnostics",
    "palmwave-shader/diagnostics",
]

[lints]
workspace = true
